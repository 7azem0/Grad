[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-strategy"
version = "0.1.0"
description = "Historical F1 lap-time modelling prototype"
requires-python = ">=3.11"
dependencies = [
  "fastf1>=3.8,<4",
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
